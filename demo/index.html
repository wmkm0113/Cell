<!DOCTYPE html>
<html lang="" class="initialize">
<head>
    <title>Test</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <link rel="shortcut icon" href="./favicon.ico"/>
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="./images/icon.svg"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta/styles/Cell.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta/styles/theme.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta/demo/styles/style.css"/>
    <script type="module">
        import {Config, Comment, DebugMode, ColorMode} from "https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta/commons/Commons.js";

        Comment.DateTime.Convert = true;
        Comment.DateTime.UTC = true;
        Config.debugMode = DebugMode.DEBUG;
        Config.colorMode = ColorMode.System;
        Config.multi = {
            codes: ["en-US", "zh-CN"],
            path: "https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta/multi/{languageCode}.json"
        };
        Config.fontPrefixPath = "https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta";
        //  Freeze header to the top of window
        Config.freeze = ['aside[id="aside"]'];

        // Setting the API Key value of Map
        // Config.maps.Google.ApiKey = "";
        // Config.maps.Baidu.ApiKey = "";
    </script>
    <script src="https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta/core/Cell.js" type="module"></script>
    <script type="module">
        window.addEventListener("load", () => {
            Cell.sendRequest("https://cdn.jsdelivr.net/gh/wmkm0113/Cell@v0.9.0-beta/demo/data.json")
                .then(responseText => responseText.parseJSON().forEach((item => $(item.id).data = item.data)))
                .catch((error) => Cell.error(error));
            Cell.multilingual();
        });
    </script>
</head>
<body>
<header id="topic">
    <span class="logo suffix registered"></span>
    <nav id="topMenu" data-type="menu"></nav>
    <nav data-type="multi" id="multiMenu"></nav>
</header>
<section data-type="slide" id="slide"></section>
<main>
    <article>
        <section id="mockElement">
            <h1 data-multi-key="Mock.Elements">Mock Elements</h1>
            <article id="mockArticle">
                <p id="star" data-type="score"></p>
                <span id="score" data-type="score"></span>
                <input type="checkbox" data-type="switch" id="mockSwitch" name="mockSwitch" data-content="Switch content"/>
                <input type="checkbox" data-type="checkbox" id="mockCheckbox" name="mockCheckbox" value="Check value" data-content="Check content"/>
                <input type="radio" id="mockRadio" name="mockRadio" value="Radio value" data-content="Radio content"/>
                <i id="tips" data-type="tips" data-content="Tips message Tips message Tips message Tips message Tips message Tips message Tips message"></i>
                <div style="width: 100%">
                    <section style="width: 70%">
                        <progress id="numberRender"></progress>
                        <span id="progressNumberRender" data-type="progress"></span>
                        <progress id="detailsRender"></progress>
                        <span id="progressDetailsRender" data-type="progress"></span>
                    </section>
                    <section style="width: 30%">
                        <span id="numberRingRender" data-type="progress" data-category="ring"></span>
                        <span id="progressDetailsRingRender" data-type="progress" data-category="ring"></span>
                    </section>
                </div>
                <a id="notifyBtn" title="Notify" data-mock="button" href="./notify-data.json" data-target-id="notifyArea">Notify</a>
                <a data-mock="button" title="Alter Message" href="JavaScript:Cell.alert('Alter message information')">Alter Message</a>
                <a data-mock="button" title="Confirm Dialog" href="JavaScript:Cell.confirm('Confirm message information', () => {alert('Confirmed')})">Confirm Dialog</a>
                <a data-mock="button" title="2" data-category="like" id="likeMockBtn">2</a>
                <a data-mock="button" data-category="favorite" id="mockFavBtn"></a>
                <input type="button" data-category="like" id="likeBtn" value="2"/>
                <input type="button" data-category="favorite" id="favBtn" data-status="true"/>
                <span data-type="calendar" id="calendar"></span>
                <span data-type="tabs-item" id="tabComponent"></span>
                <span data-type="group-item" id="groupComponent"></span>
            </article>
        </section>
        <section id="charts">
            <h1 data-multi-key="Chart.Widgets">Chart Widgets</h1>
            <article>
                <section id="pieChart" data-type="chart" data-style="pie"></section>
                <section id="roseChart" data-type="chart" data-style="rose"></section>
                <section id="circleChart" data-type="chart" data-style="ring"></section>
                <section id="columnChart" data-type="chart" data-style="column"></section>
                <section id="waterfallChart" data-type="chart" data-style="waterfall"></section>
                <section id="barChart" data-type="chart" data-style="bar"></section>
                <section id="k-line" data-type="chart" data-style="k-line"></section>
            </article>
        </section>
        <section id="listDemo">
            <h1 data-multi-key="Message.List">Message List</h1>
            <div data-type="grid" id="messageList"></div>
        </section>
        <a data-type="banner" id="contentBanner"></a>
        <section id="formDemo">
            <h1 data-multi-key="Form.Info">Form Info</h1>
            <form data-type="form" id="formInfo"></form>
            <form data-type="form" id="calendarForm"></form>
        </section>
        <section id="detailsDemo">
            <h1 data-multi-key="Message.Details">Message Details</h1>
            <span data-type="details" data-category="message" id="messageDetails"></span>
        </section>
        <section id="corpDetailsDemo">
            <h1 data-multi-key="Corporate.Details">Corporate Details</h1>
            <span data-type="details" data-category="corporate" id="corpDetails"></span>
        </section>
    </article>
    <aside id="aside">
        <nav id="asideMenu" data-type="menu"></nav>
        <a data-type="banner" id="widgetLink"></a>
        <span data-type="property" data-category="info" id="property"></span>
        <section data-type="address" id="addressDetails"></section>
    </aside>
</main>
<footer>
    <nav data-type="social" id="socialGroup"></nav>
    <div id="copyRight">
        <span id="poweredBy">Powered By Cell.js</span>
    </div>
</footer>
<notify-area id="notifyArea"></notify-area>
</body>
